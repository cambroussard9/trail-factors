name: Secret scanning

on:
  push:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the whole history, not just the pushed commits
          persist-credentials: false
      # FULL HISTORY: with `head` set and `base` empty, the action scans every
      # commit reachable from the pushed commit rather than only the push's
      # own range. The action always passes --fail, so any reported finding
      # fails the job; --results limits reporting to verified and unknown.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          base: ""
          head: ${{ github.sha }}
          version: 3.99.7
          extra_args: --results=verified,unknown
