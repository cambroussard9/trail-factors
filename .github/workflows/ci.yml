name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install (Python from .python-version, dependencies from uv.lock)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      # TRAIL_FACTORS_DB is deliberately NOT set: tests that need an ingested
      # corpus skip with a stated reason, and no test may create a database.
      - name: pytest
        run: uv run pytest
