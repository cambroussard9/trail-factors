# Install once with `pre-commit install`; run everything with
# `pre-commit run --all-files`. gitleaks scans what is STAGED.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # keep in step with the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format
